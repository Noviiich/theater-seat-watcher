name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: theater-tickets-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          test -n "$DEPLOY_SSH_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_ENV_FILE"
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > "$HOME/.ssh/deploy_key.pub"
      - name: Bootstrap bare server
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=60 -p "$port")
          bootstrap_script="/tmp/theater-seat-watcher-bootstrap-${GITHUB_RUN_ID}.sh"
          public_key="/tmp/theater-seat-watcher-deploy-${GITHUB_RUN_ID}.pub"
          ssh "${ssh_options[@]}" "$remote" \
            "umask 077; cat > $bootstrap_script" < deploy/bootstrap-ubuntu-debian.sh
          ssh "${ssh_options[@]}" "$remote" \
            "umask 077; cat > $public_key" < "$HOME/.ssh/deploy_key.pub"
          ssh "${ssh_options[@]}" "$remote" \
            "set -eu; trap 'rm -f $bootstrap_script $public_key' EXIT; if [ \"\$(id -u)\" -eq 0 ]; then bash $bootstrap_script '$DEPLOY_SSH_USER' $public_key; else sudo -n bash $bootstrap_script '$DEPLOY_SSH_USER' $public_key; fi"
      - name: Build executable image
        run: |
          set -euo pipefail
          image="theater-tickets:$GITHUB_SHA"
          docker build --platform linux/amd64 --tag "$image" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file deploy/Dockerfile .
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
          docker run --rm "$image" diagnose
      - name: Upload and deploy release
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          set -euo pipefail
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping this release"
            exit 0
          fi
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          image="theater-tickets:$GITHUB_SHA"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -p "$port")
          ssh "${ssh_options[@]}" "$remote" \
            "mkdir -p /opt/theater-seat-watcher/releases/$release_id /opt/theater-seat-watcher/shared"
          if [[ -n "$DEPLOY_ENV_FILE" ]]; then
            printf '%s\n' "$DEPLOY_ENV_FILE" | \
              ssh "${ssh_options[@]}" "$remote" \
                'umask 077; cat > /opt/theater-seat-watcher/shared/.env.tmp && mv /opt/theater-seat-watcher/shared/.env.tmp /opt/theater-seat-watcher/shared/.env'
          fi
          tar -cf - config deploy | \
            ssh "${ssh_options[@]}" "$remote" \
              "tar -xf - -C /opt/theater-seat-watcher/releases/$release_id"
          ssh "${ssh_options[@]}" "$remote" \
            "bash /opt/theater-seat-watcher/releases/$release_id/deploy/prepare-image-upload.sh"
          echo "Uploading ready image $image"
          docker save "$image" | gzip -1 | \
            ssh "${ssh_options[@]}" "$remote" 'gzip -d | docker load'
          ssh "${ssh_options[@]}" "$remote" \
            "bash /opt/theater-seat-watcher/releases/$release_id/deploy/deploy-release.sh $release_id"
