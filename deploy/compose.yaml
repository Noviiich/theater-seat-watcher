services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${THEATER_TICKETS_IMAGE:-theater-tickets:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/theater_tickets.sqlite3
      HALL_PROFILES_PATH: /app/config/halls
    volumes:
      - theater_tickets_data:/app/data
      - theater_tickets_backups:/app/backups
      - ../config/halls:/app/config/halls:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "theater-tickets", "smoke"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  theater_tickets_data:
    name: theater_tickets_data
  theater_tickets_backups:
    name: theater_tickets_backups
