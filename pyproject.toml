[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "theater-tickets"
version = "0.1.0"
description = "Telegram bot for monitoring theatre sessions and ticket holds."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "theater_tickets maintainers" }]
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "greenlet>=3.0,<4",
    "playwright>=1.63,<2",
    "PyYAML>=6.0,<7",
]

[project.scripts]
theater-tickets = "theater_tickets.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/theater_tickets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
no_implicit_reexport = true
